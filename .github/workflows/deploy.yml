name: Desplegar backend en Fly.io

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  desplegar:
    name: Construir y desplegar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # Variable de repositorio opcional; si existe, manda sobre el nombre derivado.
      FLY_APP_VAR: ${{ vars.FLY_APP }}
    steps:
      # Fly es opcional: sin secreto el workflow termina en verde con un aviso.
      - name: Comprobar si Fly esta configurado
        id: fly
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "configurado=false" >> "$GITHUB_OUTPUT"
            echo "Fly no configurado: ver ARRANQUE.md, seccion Fly" >> "$GITHUB_STEP_SUMMARY"
            echo "Fly no configurado: ver ARRANQUE.md, seccion Fly"
          else
            echo "configurado=true" >> "$GITHUB_OUTPUT"
            echo "Token presente (valor oculto)."
          fi

      # Nombre de la app: variable FLY_APP si existe; si no, <repo>-<owner> en
      # minusculas, saneado a [a-z0-9-] y recortado a 30 caracteres.
      - name: Determinar el nombre de la app
        id: app
        if: steps.fly.outputs.configurado == 'true'
        run: |
          if [ -n "${FLY_APP_VAR}" ]; then
            app="${FLY_APP_VAR}"
            origen="variable de repositorio FLY_APP"
          else
            nombre="${GITHUB_REPOSITORY#*/}"
            owner="${GITHUB_REPOSITORY%%/*}"
            app="$(printf '%s-%s' "${nombre}" "${owner}" \
              | tr '[:upper:]' '[:lower:]' \
              | tr -c 'a-z0-9-' '-' \
              | cut -c1-30 \
              | sed 's/-*$//')"
            origen="derivado de ${GITHUB_REPOSITORY}"
          fi
          if [ -z "${app}" ]; then
            echo "::error::No se pudo determinar el nombre de la app de Fly."
            exit 1
          fi
          echo "App de Fly: ${app} (${origen})"
          echo "app=${app}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.fly.outputs.configurado == 'true'
        uses: actions/checkout@v5

      - name: Instalar flyctl
        if: steps.fly.outputs.configurado == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Crear la app si no existe
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
        run: flyctl apps create "${FLY_APP}" --org desdemovil || true

      # Volumen para SQLite (app/fly.toml, [mounts]): se crea una sola vez.
      - name: Crear el volumen de datos si no existe
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
        run: |
          region="$(sed -n 's/^primary_region *= *"\(.*\)"/\1/p' app/fly.toml)"
          if flyctl volumes list --app "${FLY_APP}" --json | grep -q '"name": *"datos"'; then
            echo "Volumen datos ya existe."
          else
            flyctl volumes create datos --app "${FLY_APP}" --region "${region}" --size 1 --yes
          fi

      # Token de acceso a /notas (D8): secreto de repositorio TOKEN_API. Sin el, la API queda abierta.
      - name: Fijar TOKEN_API si existe el secreto
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
          TOKEN_API: ${{ secrets.TOKEN_API }}
        run: |
          if [ -n "${TOKEN_API}" ]; then
            flyctl secrets set "TOKEN_API=${TOKEN_API}" --app "${FLY_APP}" --stage
            echo "Token de acceso configurado (valor oculto)."
          else
            flyctl secrets unset TOKEN_API --app "${FLY_APP}" --stage 2>/dev/null || true
            echo "AVISO: sin secreto TOKEN_API, la API de notas queda abierta." >> "$GITHUB_STEP_SUMMARY"
            echo "AVISO: sin secreto TOKEN_API, la API de notas queda abierta."
          fi

      # Clave del servicio de modelos (D5/D9): secreto de repositorio LLM_API_KEY,
      # que es la clave de esta aplicacion en el servicio openrouter. Sin el, las
      # notas se guardan con titulo de respaldo y sin etiquetas (D6), que es un
      # modo previsto y no un fallo.
      - name: Fijar la clave de la IA si existe el secreto
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE: ${{ vars.LLM_BASE }}
          LLM_MODELO: ${{ vars.LLM_MODELO }}
          LLM_MODELO_DOCUMENTO: ${{ vars.LLM_MODELO_DOCUMENTO }}
          LLM_MODELO_AUDIO: ${{ vars.LLM_MODELO_AUDIO }}
        run: |
          if [ -n "${LLM_API_KEY}" ]; then
            flyctl secrets set "LLM_API_KEY=${LLM_API_KEY}" --app "${FLY_APP}" --stage
            echo "Clave de la IA configurada (valor oculto)."
          else
            flyctl secrets unset LLM_API_KEY --app "${FLY_APP}" --stage 2>/dev/null || true
            echo "AVISO: sin secreto LLM_API_KEY, las notas van sin titulo ni etiquetas de IA." >> "$GITHUB_STEP_SUMMARY"
            echo "AVISO: sin secreto LLM_API_KEY, las notas van sin titulo ni etiquetas de IA."
          fi
          # Ambas son variables de repositorio opcionales: sin ellas valen el
          # servidor y el modelo por defecto.
          if [ -n "${LLM_BASE}" ]; then
            flyctl secrets set "LLM_BASE=${LLM_BASE}" --app "${FLY_APP}" --stage
            echo "Servicio de modelos: ${LLM_BASE}"
          else
            flyctl secrets unset LLM_BASE --app "${FLY_APP}" --stage 2>/dev/null || true
          fi
          if [ -n "${LLM_MODELO}" ]; then
            flyctl secrets set "LLM_MODELO=${LLM_MODELO}" --app "${FLY_APP}" --stage
            echo "Modelo: ${LLM_MODELO}"
          else
            flyctl secrets unset LLM_MODELO --app "${FLY_APP}" --stage 2>/dev/null || true
          fi
          # Redactar un documento (F5) no es tarea del modelo barato que titula.
          if [ -n "${LLM_MODELO_DOCUMENTO}" ]; then
            flyctl secrets set "LLM_MODELO_DOCUMENTO=${LLM_MODELO_DOCUMENTO}" --app "${FLY_APP}" --stage
            echo "Modelo de documentos: ${LLM_MODELO_DOCUMENTO}"
          else
            flyctl secrets unset LLM_MODELO_DOCUMENTO --app "${FLY_APP}" --stage 2>/dev/null || true
          fi
          # Transcribir entrevistas (D30) pide un modelo con entrada de audio.
          if [ -n "${LLM_MODELO_AUDIO}" ]; then
            flyctl secrets set "LLM_MODELO_AUDIO=${LLM_MODELO_AUDIO}" --app "${FLY_APP}" --stage
            echo "Modelo de audio: ${LLM_MODELO_AUDIO}"
          else
            flyctl secrets unset LLM_MODELO_AUDIO --app "${FLY_APP}" --stage 2>/dev/null || true
          fi

      - name: Fijar BUILD_ID con el SHA del commit
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
        run: flyctl secrets set "BUILD_ID=${GITHUB_SHA}" --app "${FLY_APP}" --stage

      - name: Desplegar en Fly.io
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
        run: flyctl deploy app --app "${FLY_APP}" --remote-only --ha=false

      - name: Verificar /salud
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
          SHA: ${{ github.sha }}
        run: |
          url="https://${FLY_APP}.fly.dev/salud"
          echo "Verificando ${url} (se espera build=${SHA})"
          for intento in $(seq 1 10); do
            respuesta="$(curl -fsS --max-time 20 "${url}" || true)"
            echo "Intento ${intento}/10: ${respuesta:-<sin respuesta>}"
            if printf '%s' "${respuesta}" | grep -q "${SHA}"; then
              echo "OK: /salud responde con el build ${SHA}"
              exit 0
            fi
            if [ "${intento}" -lt 10 ]; then
              sleep 15
            fi
          done
          echo "::error::/salud no devolvio el SHA ${SHA} tras 10 intentos (150 s)."
          exit 1

      # Lo que consume docs/holamundo.html desde Pages: cuerpo exacto y CORS.
      - name: Verificar /holamundo
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
        run: |
          url="https://${FLY_APP}.fly.dev/holamundo"
          cabeceras="$(curl -fsS --max-time 20 -D - -o /tmp/cuerpo "${url}")"
          cuerpo="$(cat /tmp/cuerpo)"
          echo "Respuesta: ${cuerpo}"
          [ "${cuerpo}" = "holamundo" ] || { echo "::error::/holamundo devolvio '${cuerpo}'"; exit 1; }
          printf '%s' "${cabeceras}" | grep -qi '^access-control-allow-origin: \*' \
            || { echo "::error::/holamundo sin cabecera CORS"; exit 1; }
          echo "OK: /holamundo responde 'holamundo' con CORS"

      # CRUD de notas (F1): crear, leer, listar con filtro y borrar.
      - name: Verificar /notas
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
          TOKEN_API: ${{ secrets.TOKEN_API }}
        run: |
          base="https://${FLY_APP}.fly.dev"
          marca="verificacion-deploy-${GITHUB_SHA:0:7}"
          auth="Authorization: Bearer ${TOKEN_API}"
          if [ -n "${TOKEN_API}" ]; then
            codigo="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "${base}/notas")"
            [ "${codigo}" = "401" ] || { echo "::error::/notas sin token devolvio ${codigo}, se esperaba 401"; exit 1; }
            echo "OK: /notas sin token -> 401"
          fi
          nota="$(curl -fsS --max-time 20 -X POST "${base}/notas" -H 'Content-Type: application/json' -H "${auth}" \
            -d "{\"contenido\":\"Nota de ${marca}. Reunión de verificación.\"}")"
          echo "Creada: ${nota}"
          id="$(printf '%s' "${nota}" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')"
          [ -n "${id}" ] || { echo "::error::POST /notas no devolvio id"; exit 1; }
          # F3: sin acentos y por prefijo ("reunion" encuentra "Reunión")
          curl -fsS --max-time 20 -H "${auth}" "${base}/notas?q=reunion+${marca}" | grep -q "\"id\":\"${id}\"" \
            || { echo "::error::GET /notas?q=reunion no encuentra la nota ${id}"; exit 1; }
          curl -fsS --max-time 20 -o /dev/null -w '%{http_code}\n' -X DELETE -H "${auth}" "${base}/notas/${id}" | grep -q '^204$' \
            || { echo "::error::DELETE /notas/${id} no devolvio 204"; exit 1; }
          echo "OK: /notas crea, busca sin acentos y borra"

      # F14: proyectos (D14-D23). Crear, nota dentro, filtrar, mover, el 409 del
      # nombre repetido, y que borrar el proyecto deja la nota viva y sin proyecto.
      - name: Verificar /proyectos
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
          TOKEN_API: ${{ secrets.TOKEN_API }}
        run: |
          base="https://${FLY_APP}.fly.dev"
          auth="Authorization: Bearer ${TOKEN_API}"
          json='Content-Type: application/json'
          marca="${GITHUB_SHA:0:7}-${GITHUB_RUN_ATTEMPT}"
          proy="$(curl -fsS --max-time 20 -X POST "${base}/proyectos" -H "${json}" -H "${auth}" \
            -d "{\"nombre\":\"Verificación ${marca}\",\"descripcion\":\"proyecto de deploy.yml\"}")"
          echo "Creado: ${proy}"
          pid="$(printf '%s' "${proy}" | sed -n 's/^{"id":"\([^"]*\)".*/\1/p')"
          [ -n "${pid}" ] || { echo "::error::POST /proyectos no devolvio id"; exit 1; }
          nid=""
          trap 'curl -sS --max-time 20 -o /dev/null -X DELETE -H "${auth}" "${base}/proyectos/${pid}" || true; [ -z "${nid}" ] || curl -fsS --max-time 20 -o /dev/null -X DELETE -H "${auth}" "${base}/notas/${nid}" || true' EXIT

          codigo="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -X POST "${base}/proyectos" -H "${json}" -H "${auth}" \
            -d "{\"nombre\":\"VERIFICACION  ${marca}\"}")"
          [ "${codigo}" = "409" ] || { echo "::error::nombre repetido devolvio ${codigo}, se esperaba 409"; exit 1; }
          echo "OK: nombre repetido sin distinguir mayusculas ni acentos -> 409"

          nota="$(curl -fsS --max-time 30 -X POST "${base}/notas" -H "${json}" -H "${auth}" \
            -d "{\"contenido\":\"Nota de proyecto ${marca}\",\"proyecto\":\"${pid}\"}")"
          nid="$(printf '%s' "${nota}" | sed -n 's/^{"id":"\([^"]*\)".*/\1/p')"
          [ -n "${nid}" ] || { echo "::error::POST /notas con proyecto no devolvio id"; exit 1; }
          printf '%s' "${nota}" | grep -q "\"proyecto\":{\"id\":\"${pid}\"" \
            || { echo "::error::la nota no quedo en su proyecto: ${nota}"; exit 1; }
          curl -fsS --max-time 20 -H "${auth}" "${base}/notas?proyecto=${pid}" | grep -q "\"id\":\"${nid}\"" \
            || { echo "::error::GET /notas?proyecto= no trae la nota"; exit 1; }
          if curl -fsS --max-time 20 -H "${auth}" "${base}/notas?proyecto=ninguno" | grep -q "\"id\":\"${nid}\""; then
            echo "::error::la nota del proyecto sale en «Sin proyecto»"; exit 1
          fi
          curl -fsS --max-time 20 -H "${auth}" "${base}/proyectos?q=verificacion+${marca}" | grep -q "\"id\":\"${pid}\".*\"notas\":1" \
            || { echo "::error::GET /proyectos?q= no encuentra el proyecto con su nota"; exit 1; }
          echo "OK: /proyectos crea, busca sin acentos y cuenta; /notas filtra por proyecto"

          curl -fsS --max-time 20 -X PATCH "${base}/notas/${nid}" -H "${json}" -H "${auth}" -d '{"proyecto":null}' \
            | grep -q '"proyecto":null' || { echo "::error::PATCH /notas no la saco del proyecto"; exit 1; }
          # PUT corrige el texto y lo guarda entero: 6000 caracteres vuelven tal cual.
          largo="$(printf 'x%.0s' $(seq 1 6000))"
          editada="$(curl -fsS --max-time 20 -X PUT "${base}/notas/${nid}" -H "${json}" -H "${auth}" \
            -d "{\"contenido\":\"${largo} ${marca}\",\"titulo\":\"Editada ${marca}\"}")"
          printf '%s' "${editada}" | grep -q "\"titulo\":\"Editada ${marca}\"" \
            || { echo "::error::PUT /notas no cambio el titulo"; exit 1; }
          printf '%s' "${editada}" | grep -q "${largo} ${marca}" \
            || { echo "::error::PUT /notas no guardo el contenido entero"; exit 1; }
          echo "OK: PUT /notas edita titulo y contenido largo"
          curl -fsS --max-time 20 -X POST "${base}/notas/mover" -H "${json}" -H "${auth}" \
            -d "{\"notas\":[\"${nid}\"],\"proyecto\":\"${pid}\"}" | grep -q '"movidas":1' \
            || { echo "::error::POST /notas/mover no la movio"; exit 1; }
          echo "OK: mover una nota (PATCH) y en bloque (POST /notas/mover)"

          curl -fsS --max-time 20 -o /dev/null -w '%{http_code}\n' -X DELETE -H "${auth}" "${base}/proyectos/${pid}" | grep -q '^204$' \
            || { echo "::error::DELETE /proyectos no devolvio 204"; exit 1; }
          curl -fsS --max-time 20 -H "${auth}" "${base}/notas/${nid}" | grep -q '"proyecto":null' \
            || { echo "::error::al borrar el proyecto la nota no quedo en «Sin proyecto»"; exit 1; }
          echo "OK: borrar el proyecto no borra su nota (D19)"

      # F23: subcarpetas (D43-D53). Un nivel, nombre unico dentro del padre, el
      # padre trae lo de sus subcarpetas salvo con solo=1, y borrar no pierde
      # nada: la nota de la subcarpeta sube al padre y, al borrar el padre, la
      # subcarpeta queda como proyecto principal.
      - name: Verificar subcarpetas
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
          TOKEN_API: ${{ secrets.TOKEN_API }}
        run: |
          base="https://${FLY_APP}.fly.dev"
          auth="Authorization: Bearer ${TOKEN_API}"
          json='Content-Type: application/json'
          marca="${GITHUB_SHA:0:7}-${GITHUB_RUN_ATTEMPT}"
          id_de() { sed -n 's/^{"id":"\([^"]*\)".*/\1/p'; }
          pid="$(curl -fsS --max-time 20 -X POST "${base}/proyectos" -H "${json}" -H "${auth}" \
            -d "{\"nombre\":\"Padre ${marca}\"}" | id_de)"
          [ -n "${pid}" ] || { echo "::error::POST /proyectos no devolvio id"; exit 1; }
          hid=""; hid2=""; nid=""; nid2=""
          trap 'for x in "${hid}" "${hid2}" "${pid}"; do [ -z "${x}" ] || curl -sS --max-time 20 -o /dev/null -X DELETE -H "${auth}" "${base}/proyectos/${x}" || true; done; for x in "${nid}" "${nid2}"; do [ -z "${x}" ] || curl -sS --max-time 20 -o /dev/null -X DELETE -H "${auth}" "${base}/notas/${x}" || true; done' EXIT

          sub="$(curl -fsS --max-time 20 -X POST "${base}/proyectos" -H "${json}" -H "${auth}" \
            -d "{\"nombre\":\"Diseño ${marca}\",\"padre\":\"${pid}\"}")"
          hid="$(printf '%s' "${sub}" | id_de)"
          printf '%s' "${sub}" | grep -q "\"padre\":{\"id\":\"${pid}\"" \
            || { echo "::error::la subcarpeta no trae su padre: ${sub}"; exit 1; }
          codigo="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -X POST "${base}/proyectos" -H "${json}" -H "${auth}" \
            -d "{\"nombre\":\"DISEÑO ${marca}\",\"padre\":\"${pid}\"}")"
          [ "${codigo}" = "409" ] || { echo "::error::nombre repetido en el mismo padre devolvio ${codigo}, se esperaba 409"; exit 1; }
          hid2="$(curl -fsS --max-time 20 -X POST "${base}/proyectos" -H "${json}" -H "${auth}" \
            -d "{\"nombre\":\"Diseño ${marca}\"}" | id_de)"
          [ -n "${hid2}" ] || { echo "::error::el mismo nombre como proyecto principal no se pudo crear"; exit 1; }
          codigo="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -X POST "${base}/proyectos" -H "${json}" -H "${auth}" \
            -d "{\"nombre\":\"Nieta ${marca}\",\"padre\":\"${hid}\"}")"
          [ "${codigo}" = "400" ] || { echo "::error::subcarpeta de subcarpeta devolvio ${codigo}, se esperaba 400"; exit 1; }
          echo "OK: subcarpeta con padre, nombre unico dentro del padre, un solo nivel"

          nid="$(curl -fsS --max-time 30 -X POST "${base}/notas" -H "${json}" -H "${auth}" \
            -d "{\"contenido\":\"Nota de subcarpeta ${marca}\",\"proyecto\":\"${hid}\"}" | id_de)"
          nid2="$(curl -fsS --max-time 30 -X POST "${base}/notas" -H "${json}" -H "${auth}" \
            -d "{\"contenido\":\"Nota del padre ${marca}\",\"proyecto\":\"${pid}\"}" | id_de)"
          [ -n "${nid}" ] && [ -n "${nid2}" ] || { echo "::error::no se pudieron crear las notas"; exit 1; }
          curl -fsS --max-time 20 -H "${auth}" "${base}/notas?proyecto=${pid}" | grep -q "\"id\":\"${nid}\"" \
            || { echo "::error::el padre no trae la nota de su subcarpeta"; exit 1; }
          if curl -fsS --max-time 20 -H "${auth}" "${base}/notas?proyecto=${pid}&solo=1" | grep -q "\"id\":\"${nid}\""; then
            echo "::error::con solo=1 el padre sigue trayendo la nota de la subcarpeta"; exit 1
          fi
          curl -fsS --max-time 20 -H "${auth}" "${base}/proyectos/${pid}" | grep -q '"notas":2,.*"notas_propias":1,"subcarpetas":1' \
            || { echo "::error::las cifras del padre no suman su subcarpeta"; exit 1; }
          echo "OK: el padre trae lo de sus subcarpetas; solo=1 lo acota; las cifras suman"

          curl -fsS --max-time 20 -o /dev/null -X DELETE -H "${auth}" "${base}/proyectos/${hid}"
          curl -fsS --max-time 20 -H "${auth}" "${base}/notas/${nid}" | grep -q "\"proyecto\":{\"id\":\"${pid}\"" \
            || { echo "::error::al borrar la subcarpeta su nota no subio al padre"; exit 1; }
          hid="$(curl -fsS --max-time 20 -X POST "${base}/proyectos" -H "${json}" -H "${auth}" \
            -d "{\"nombre\":\"Diseño ${marca}\",\"padre\":\"${pid}\"}" | id_de)"
          curl -fsS --max-time 20 -o /dev/null -X DELETE -H "${auth}" "${base}/proyectos/${pid}"
          pid=""
          curl -fsS --max-time 20 -H "${auth}" "${base}/proyectos/${hid}" | grep -q "\"nombre\":\"Diseño ${marca} (Padre ${marca})\".*\"padre\":null" \
            || { echo "::error::al borrar el padre la subcarpeta no paso a principal con el nombre desambiguado"; exit 1; }
          curl -fsS --max-time 20 -H "${auth}" "${base}/notas/${nid}" | grep -q '"proyecto":null' \
            || { echo "::error::al borrar el padre su nota no quedo en «Sin proyecto»"; exit 1; }
          echo "OK: borrar una subcarpeta sube sus notas; borrar el padre deja la subcarpeta como principal (D51)"

      # F2: con clave, una nota real tiene que volver titulada y etiquetada.
      # Cuesta una fraccion de centimo y es la unica forma de saber que la
      # cadena entera (Fly -> servicio -> modelo) funciona de verdad.
      - name: Verificar la IA
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
          TOKEN_API: ${{ secrets.TOKEN_API }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          base="https://${FLY_APP}.fly.dev"
          auth="Authorization: Bearer ${TOKEN_API}"
          salud="$(curl -fsS --max-time 20 "${base}/salud")"
          if [ -z "${LLM_API_KEY}" ]; then
            printf '%s' "${salud}" | grep -q '"ia":false' \
              || { echo "::error::sin secreto LLM_API_KEY, /salud deberia decir \"ia\":false"; exit 1; }
            echo "OK: sin clave de IA, el servicio lo declara y las notas se guardan igual (D6)"
            exit 0
          fi
          printf '%s' "${salud}" | grep -q '"ia":true' \
            || { echo "::error::con secreto LLM_API_KEY, /salud dice ${salud}"; exit 1; }
          nota="$(curl -fsS --max-time 30 -X POST "${base}/notas" -H 'Content-Type: application/json' -H "${auth}" \
            -d '{"contenido":"Llamar mañana al taller para la revisión del coche y pedir presupuesto de los neumáticos."}')"
          echo "Creada: ${nota}"
          id="$(printf '%s' "${nota}" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')"
          [ -n "${id}" ] || { echo "::error::POST /notas no devolvio id"; exit 1; }
          # Se borra pase lo que pase: la verificacion no deja basura en la base.
          trap 'curl -fsS --max-time 20 -o /dev/null -X DELETE -H "${auth}" "${base}/notas/${id}" || true' EXIT
          printf '%s' "${nota}" | grep -q '"pendiente_ia":false' \
            || { echo "::error::la nota quedo pendiente de IA: el servicio de modelos no respondio"; exit 1; }
          printf '%s' "${nota}" | grep -q '"etiquetas":\[".' \
            || { echo "::error::la nota volvio sin etiquetas"; exit 1; }
          echo "OK: la IA titula y etiqueta"

      # F5: un documento real de punta a punta. Solo con clave: sin IA la ruta
      # contesta 503 a proposito y eso tambien se comprueba.
      - name: Verificar /documentos
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
          TOKEN_API: ${{ secrets.TOKEN_API }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          base="https://${FLY_APP}.fly.dev"
          auth="Authorization: Bearer ${TOKEN_API}"
          marca="doc-${GITHUB_SHA:0:7}"
          n1="$(curl -fsS --max-time 30 -X POST "${base}/notas" -H 'Content-Type: application/json' -H "${auth}" \
            -d "{\"contenido\":\"${marca}: el buscador tarda mucho cuando hay muchas notas guardadas.\"}")"
          n2="$(curl -fsS --max-time 30 -X POST "${base}/notas" -H 'Content-Type: application/json' -H "${auth}" \
            -d "{\"contenido\":\"${marca}: quiero paginar la lista y que el filtro por etiqueta se mantenga.\"}")"
          id1="$(printf '%s' "${n1}" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')"
          id2="$(printf '%s' "${n2}" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')"
          [ -n "${id1}" ] && [ -n "${id2}" ] || { echo "::error::no se pudieron crear las notas de prueba"; exit 1; }
          trap 'for n in "${id1}" "${id2}"; do curl -fsS --max-time 20 -o /dev/null -X DELETE -H "${auth}" "${base}/notas/${n}" || true; done' EXIT

          if [ -z "${LLM_API_KEY}" ]; then
            codigo="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -X POST "${base}/documentos" \
              -H 'Content-Type: application/json' -H "${auth}" -d "{\"notas\":[\"${id1}\"]}")"
            [ "${codigo}" = "503" ] || { echo "::error::sin clave de IA, POST /documentos devolvio ${codigo}, se esperaba 503"; exit 1; }
            echo "OK: sin clave de IA, /documentos lo dice y no crea nada"
            exit 0
          fi

          doc="$(curl -fsS --max-time 30 -X POST "${base}/documentos" -H 'Content-Type: application/json' -H "${auth}" \
            -d "{\"notas\":[\"${id2}\",\"${id1}\"],\"instruccion\":\"centrate en el rendimiento\"}")"
          echo "Creado: $(printf '%s' "${doc}" | cut -c1-200)"
          doc_id="$(printf '%s' "${doc}" | sed -n 's/^{"id":"\([^"]*\)".*/\1/p')"
          [ -n "${doc_id}" ] || { echo "::error::POST /documentos no devolvio id"; exit 1; }
          trap 'curl -fsS --max-time 20 -o /dev/null -X DELETE -H "${auth}" "${base}/documentos/${doc_id}" || true; for n in "${id1}" "${id2}"; do curl -fsS --max-time 20 -o /dev/null -X DELETE -H "${auth}" "${base}/notas/${n}" || true; done' EXIT

          # Se genera en segundo plano: se pregunta hasta dos minutos y medio.
          estado="pendiente"
          for intento in $(seq 1 30); do
            sleep 5
            actual="$(curl -fsS --max-time 20 -H "${auth}" "${base}/documentos/${doc_id}")"
            estado="$(printf '%s' "${actual}" | sed -n 's/.*"estado":"\([^"]*\)".*/\1/p')"
            echo "Intento ${intento}/30: estado=${estado}"
            [ "${estado}" = "pendiente" ] || break
          done
          [ "${estado}" = "listo" ] || { echo "::error::el documento acabo en estado '${estado}': ${actual}"; exit 1; }
          for seccion in "## Objetivo" "## Requisitos" "## Criterios de aceptación" "## Notas de origen"; do
            printf '%s' "${actual}" | grep -qF "${seccion}" \
              || { echo "::error::el documento no trae la seccion ${seccion}"; exit 1; }
          done
          echo "OK: /documentos redacta el encargo con su estructura y sus notas de origen"

      # F18-F20: una entrevista de punta a punta. Subida, audio con Range, token
      # y borrado siempre; con clave de IA, ademas, transcribir una voz
      # sintetica de verdad (Fly -> ffmpeg -> servicio -> modelo con audio),
      # resumir y guardar como nota. Sin clave, transcribir tiene que dar 503.
      - name: Verificar /entrevistas
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
          TOKEN_API: ${{ secrets.TOKEN_API }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          base="https://${FLY_APP}.fly.dev"
          auth="Authorization: Bearer ${TOKEN_API}"
          campo() { jq -r "$1" <<< "$2"; }
          curl -fsS --max-time 20 "${base}/salud" | grep -q '"ffmpeg":true' \
            || { echo "::error::/salud no declara ffmpeg: la imagen no lo trae y no se podra transcribir"; exit 1; }
          sudo apt-get install -y -qq espeak-ng ffmpeg > /dev/null
          espeak-ng -v es -s 150 -w voz.wav "Hola, esto es una prueba de la entrevista. Hablamos del pedido de octubre y de la fecha de entrega."
          ffmpeg -loglevel error -y -i voz.wav -ac 1 -c:a libopus -b:a 32k voz.webm
          if [ -n "${TOKEN_API}" ]; then
            codigo="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "${base}/entrevistas")"
            [ "${codigo}" = "401" ] || { echo "::error::sin token, GET /entrevistas devolvio ${codigo}"; exit 1; }
          fi
          e="$(curl -fsS --max-time 60 -X POST "${base}/entrevistas" -H "${auth}" \
            -F con_quien="Prueba" -F duracion_s=6 -F "titulo=Verificacion ${GITHUB_SHA:0:7}" -F "audio=@voz.webm;type=audio/webm")"
          id="$(campo .id "${e}")"
          [ -n "${id}" ] && [ "${id}" != "null" ] || { echo "::error::POST /entrevistas no devolvio id: ${e}"; exit 1; }
          nota=""
          trap 'curl -fsS --max-time 20 -o /dev/null -X DELETE -H "${auth}" "${base}/entrevistas/${id}" || true; [ -z "${nota}" ] || curl -fsS --max-time 20 -o /dev/null -X DELETE -H "${auth}" "${base}/notas/${nota}" || true' EXIT
          r="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code} %{size_download}' -H "${auth}" -H 'Range: bytes=0-99' "${base}/entrevistas/${id}/audio")"
          [ "${r}" = "206 100" ] || { echo "::error::GET audio con Range devolvio '${r}', se esperaba '206 100'"; exit 1; }
          echo "OK: subida y audio con Range"

          if [ -z "${LLM_API_KEY}" ]; then
            codigo="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -X POST -H "${auth}" "${base}/entrevistas/${id}/transcribir")"
            [ "${codigo}" = "503" ] || { echo "::error::sin clave de IA, transcribir devolvio ${codigo}, se esperaba 503"; exit 1; }
            echo "OK: sin clave de IA, transcribir lo dice y la entrevista se guarda igual"
            exit 0
          fi

          curl -fsS --max-time 20 -o /dev/null -X POST -H "${auth}" "${base}/entrevistas/${id}/transcribir"
          estado=""
          for _ in $(seq 1 60); do
            sleep 3
            actual="$(curl -fsS --max-time 20 -H "${auth}" "${base}/entrevistas/${id}")"
            estado="$(campo .estado "${actual}")"
            [ "${estado}" = "transcribiendo" ] || break
          done
          [ "${estado}" = "transcrita" ] || { echo "::error::la transcripcion acabo en '${estado}': $(campo .error "${actual}")"; exit 1; }
          texto="$(campo .transcripcion "${actual}")"
          echo "Transcripcion: ${texto}"
          grep -qi "prueba" <<< "${texto}" || { echo "::error::la transcripcion no contiene lo que se dijo"; exit 1; }
          grep -qE '^\[[0-9]+:[0-9]{2}\] ' <<< "${texto}" || { echo "::error::la transcripcion no trae el formato [mm:ss] Hablante: texto"; exit 1; }
          echo "OK: transcripcion con marcas de tiempo"

          curl -fsS --max-time 20 -o /dev/null -X POST -H "${auth}" "${base}/entrevistas/${id}/resumir"
          for _ in $(seq 1 40); do
            sleep 3
            actual="$(curl -fsS --max-time 20 -H "${auth}" "${base}/entrevistas/${id}")"
            estado="$(campo .estado_resumen "${actual}")"
            [ "${estado}" = "pendiente" ] || break
          done
          [ "${estado}" = "listo" ] || { echo "::error::el resumen acabo en '${estado}': $(campo .error_resumen "${actual}")"; exit 1; }
          [ -n "$(campo .resumen_ejecutivo "${actual}")" ] || { echo "::error::resumen ejecutivo vacio"; exit 1; }
          campo .resumen "${actual}" | grep -qF "## Acuerdos y decisiones" || { echo "::error::el resumen amplio no trae su estructura"; exit 1; }
          n="$(curl -fsS --max-time 60 -X POST -H "${auth}" -H 'Content-Type: application/json' -d '{"cual":"ejecutivo"}' "${base}/entrevistas/${id}/nota")"
          nota="$(campo .id "${n}")"
          [ -n "${nota}" ] && [ "${nota}" != "null" ] || { echo "::error::guardar como nota no devolvio la nota: ${n}"; exit 1; }
          echo "OK: resumenes y nota: $(campo .titulo "${n}")"

      - name: Resumen del despliegue
        if: success() && steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
        run: |
          region="$(sed -n 's/^primary_region *= *"\(.*\)"/\1/p' app/fly.toml)"
          {
            echo "### Backend desplegado en Fly.io"
            echo ""
            echo "- App: \`${FLY_APP}\` (region \`${region}\`)"
            echo "- URL: https://${FLY_APP}.fly.dev/"
            echo "- Salud: https://${FLY_APP}.fly.dev/salud"
            echo "- Hola mundo: https://${FLY_APP}.fly.dev/holamundo"
            echo "- Notas: https://${FLY_APP}.fly.dev/notas"
            echo "- Documentos: https://${FLY_APP}.fly.dev/documentos"
            echo "- Proyectos: https://${FLY_APP}.fly.dev/proyectos"
            echo "- Entrevistas: https://${FLY_APP}.fly.dev/entrevistas"
            echo "- Comprobacion desde Pages: https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}/holamundo.html"
            echo "- Build (SHA): \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
