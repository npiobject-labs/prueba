name: Diagnostico del backend en Fly.io

# A mano, cuando el backend no responde desde Pages: estado de las maquinas,
# ultimos logs y una llamada real a /salud y /notas con tiempos.
on:
  workflow_dispatch:
    inputs:
      destino:
        description: 'URL a probar desde la maquina de Fly (por defecto, la variable LLM_URL)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  diagnosticar:
    name: Estado, logs y llamadas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ vars.FLY_APP || 'prueba-npiobject-labs' }}
      TOKEN_API: ${{ secrets.TOKEN_API }}
    steps:
      - name: Instalar flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Estado de la app y maquinas
        run: |
          flyctl status --app "${FLY_APP}" || true
          echo "--- maquinas (json) ---"
          flyctl machines list --app "${FLY_APP}" --json | jq '.[] | {id, state, region, image: .config.image, mounts: .config.mounts, checks}' || true
          echo "--- volumenes ---"
          flyctl volumes list --app "${FLY_APP}" || true

      - name: Ultimos logs
        run: flyctl logs --app "${FLY_APP}" --no-tail 2>&1 | tail -80 || true

      - name: Llamadas reales con tiempos
        run: |
          base="https://${FLY_APP}.fly.dev"
          auth="Authorization: Bearer ${TOKEN_API}"
          for ruta in /salud /notas; do
            echo "--- GET ${ruta}"
            curl -sS --max-time 60 -o /tmp/cuerpo -w 'http=%{http_code} total=%{time_total}s\n' -H "${auth}" "${base}${ruta}" || echo "curl fallo: $?"
            head -c 400 /tmp/cuerpo; echo
          done
          echo "--- POST /notas"
          curl -sS --max-time 60 -o /tmp/cuerpo -w 'http=%{http_code} total=%{time_total}s\n' -X POST "${base}/notas" \
            -H 'Content-Type: application/json' -H "${auth}" -d '{"contenido":"Diagnostico desde Actions. Se borra sola."}' || echo "curl fallo: $?"
          head -c 400 /tmp/cuerpo; echo
          id="$(sed -n 's/.*"id":"\([^"]*\)".*/\1/p' /tmp/cuerpo)"
          [ -n "${id}" ] && curl -sS --max-time 60 -o /dev/null -w 'DELETE http=%{http_code}\n' -X DELETE -H "${auth}" "${base}/notas/${id}" || true

      # ¿Sale la maquina de Fly hacia la pasarela del LLM? DNS + TCP 443 bastan para
      # responder sin gastar credenciales: un 401 o un TCP_443_OK ya demuestran ruta;
      # un fallo de DNS o un timeout, que no la hay. La URL no se escribe aqui: sale de
      # la variable de repositorio LLM_URL o del campo de arranque.
      - name: Salida hacia la pasarela del LLM
        env:
          DESTINO: ${{ inputs.destino || vars.LLM_URL }}
        run: |
          if [ -z "${DESTINO}" ]; then
            echo "Sin variable LLM_URL ni campo 'destino': nada que probar."
            exit 0
          fi
          host="$(printf '%s' "${DESTINO}" | sed -E 's#^[a-z]+://##; s#[/?].*$##; s#:[0-9]+$##')"
          echo "Destino: ${DESTINO} (host ${host})"

          # La maquina se suspende sin trafico: una llamada a /salud la despierta antes del ssh.
          curl -sS --max-time 60 -o /dev/null "https://${FLY_APP}.fly.dev/salud" || true

          # Sin comillas simples dentro: el guion viaja entero entre comillas simples en -C.
          guion="getent hosts ${host} >/dev/null && echo DNS_OK || echo DNS_FALLO; (exec 3<>/dev/tcp/${host}/443) 2>/dev/null && echo TCP_443_OK || echo TCP_443_FALLO; command -v curl >/dev/null && curl -s -o /dev/null -m 15 -w HTTP=%{http_code} ${DESTINO}; echo"
          salida="$(flyctl ssh console --app "${FLY_APP}" -C "/bin/bash -c '${guion}'" 2>&1)" || true
          echo "${salida}"

          if printf '%s' "${salida}" | grep -q 'TCP_443_OK'; then
            echo "OK: la maquina de Fly alcanza ${host} por 443." >> "$GITHUB_STEP_SUMMARY"
          elif printf '%s' "${salida}" | grep -qE 'TCP_443_FALLO|DNS_FALLO'; then
            echo "::warning::La maquina de Fly NO alcanza ${host}: revisar DNS o salida de red."
            echo "FALLO: la maquina de Fly no alcanza ${host} (ver logs del paso)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No se pudo ejecutar la comprobacion por ssh; revisar la salida de arriba."
          fi

      - name: Estado tras las llamadas
        run: flyctl machines list --app "${FLY_APP}" --json | jq '.[] | {id, state}' || true
