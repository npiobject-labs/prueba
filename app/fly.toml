# Sin clave "app": el nombre lo decide .github/workflows/deploy.yml y se pasa con
# --app (variable de repositorio FLY_APP si existe, si no <repo>-<owner>).
# Region de Fly.io. "mad" esta deprecada; alternativas europeas: cdg, ams, lhr.
primary_region = "cdg"

# Volumen para la base SQLite (D3). deploy.yml lo crea si no existe.
[mounts]
  source = "datos"
  destination = "/data"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # "suspend" en vez de parar: reanuda en milisegundos y evita el arranque en frio que
  # hacia saltar el timeout del navegador. Si Fly no puede suspender, para como antes.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
